<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="700" viewBox="0 0 1160 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1160" height="700" fill="#ffffff"/>

  <text x="580" y="45" text-anchor="middle" font-size="28" font-weight="bold" fill="#111">CompanyEnrichment – data flow</text>
  <text x="580" y="75" text-anchor="middle" font-size="16" fill="#555">Company lookup enriched with industry statistics in a single response</text>

  <rect x="40" y="270" width="200" height="150" rx="14" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="140" y="335" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">API client</text>
  <text x="140" y="362" text-anchor="middle" font-size="15" fill="#555">e.g. sales system</text>

  <rect x="460" y="110" width="250" height="520" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="585" y="155" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">CompanyEnrichment API</text>
  <text x="585" y="180" text-anchor="middle" font-size="15" fill="#555">ASP.NET Core · Docker</text>
  <line x1="490" y1="200" x2="680" y2="200" stroke="#93c5fd" stroke-width="2"/>
  <text x="485" y="290" font-size="16" fill="#111">1. Look up company in CVR</text>
  <text x="485" y="310" font-size="13" fill="#555">    by CVR number or name</text>
  <text x="485" y="345" font-size="16" fill="#111">2. Get industry code</text>
  <text x="485" y="380" font-size="16" fill="#111">3. Fetch industry statistics</text>
  <text x="485" y="400" font-size="13" fill="#555">    table ERHV1 for the requested year</text>
  <text x="485" y="435" font-size="16" fill="#111">4. Return combined response</text>
  <rect x="470" y="545" width="230" height="70" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="585" y="567" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Error handling</text>
  <text x="585" y="586" text-anchor="middle" font-size="12" fill="#111">DST unavailable → 200 without statistics</text>
  <text x="585" y="604" text-anchor="middle" font-size="12" fill="#111">CVR unavailable → 503</text>

  <rect x="900" y="110" width="220" height="150" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1010" y="175" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">CVR API</text>
  <text x="1010" y="202" text-anchor="middle" font-size="15" fill="#555">apicvr.dk</text>
  <text x="1010" y="225" text-anchor="middle" font-size="13" fill="#777">Company master data</text>

  <rect x="900" y="430" width="220" height="150" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1010" y="495" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Statistics Denmark</text>
  <text x="1010" y="522" text-anchor="middle" font-size="15" fill="#555">api.statbank.dk</text>
  <text x="1010" y="545" text-anchor="middle" font-size="13" fill="#777">Industry statistics (ERHV1)</text>

  <line x1="240" y1="320" x2="456" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
  <text x="348" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">① GET /api/companies</text>
  <text x="348" y="310" text-anchor="middle" font-size="13" fill="#2563eb">{cvrNumber}?year=2024</text>

  <line x1="460" y1="380" x2="244" y2="380" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#green)"/>
  <text x="348" y="406" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">④ 200 OK · JSON</text>
  <text x="348" y="426" text-anchor="middle" font-size="13" fill="#16a34a">company data + statistics</text>

  <line x1="710" y1="160" x2="896" y2="160" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
  <text x="805" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">② GET /api/v1/{cvr}</text>

  <line x1="900" y1="215" x2="714" y2="215" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#green)"/>
  <text x="805" y="241" text-anchor="middle" font-size="14" fill="#16a34a">company data + industry code</text>

  <line x1="710" y1="480" x2="896" y2="480" stroke="#2563eb" stroke-width="3" marker-end="url(#blue)"/>
  <text x="805" y="468" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">③ POST /v1/data</text>

  <line x1="900" y1="535" x2="714" y2="535" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#green)"/>
  <text x="805" y="561" text-anchor="middle" font-size="14" fill="#16a34a">CSV · 4 measures</text>

  <line x1="40" y1="665" x2="70" y2="665" stroke="#2563eb" stroke-width="3"/>
  <text x="80" y="670" font-size="14" fill="#333">Request</text>
  <line x1="170" y1="665" x2="200" y2="665" stroke="#16a34a" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="210" y="670" font-size="14" fill="#333">Response</text>
  <rect x="310" y="656" width="22" height="18" rx="4" fill="#ffedd5" stroke="#ea580c"/>
  <text x="340" y="670" font-size="14" fill="#333">External source</text>
</svg>
